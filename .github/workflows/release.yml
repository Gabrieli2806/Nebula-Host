# Builds every artifact of a Nebula Host release and attaches it to a draft
# GitHub release. Push a tag like `v0.5.0` (it must match the version in
# src-tauri/tauri.conf.json), review the draft, then publish it.
#
#   Windows desktop : .msi and NSIS .exe          (windows-latest)
#   Linux desktop   : .deb, .rpm, .AppImage       (ubuntu-22.04, x86_64)
#   Linux node      : headless nebula-node .tar.gz (x86_64 and aarch64)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.0). Must already exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nebula Host $TAG" \
              --notes "Nebula Host $TAG. See the assets below for Windows and Linux."

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: msi,nsis
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}

      - run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Nebula Host ${{ env.TAG }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

  node:
    name: Headless node (${{ matrix.arch }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: node-${{ matrix.arch }}

      - name: Build nebula-node (no desktop, no webview)
        run: cargo build --release --locked -p nebula-host --no-default-features --bin nebula-node

      - name: Package
        id: package
        run: |
          name="nebula-node-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/nebula-node "dist/$name/"
          cp packaging/linux/install-node.sh packaging/linux/nebula-node.service "dist/$name/"
          chmod +x "dist/$name/install-node.sh" "dist/$name/nebula-node"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.file }}" "${{ steps.package.outputs.file }}.sha256" --clobber
