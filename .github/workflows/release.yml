# Builds every artifact of a Nebula Host release and attaches it to a draft
# GitHub release, published once every build succeeded. Raising the version
# in src-tauri/tauri.conf.json on main starts it (Auto release workflow);
# pushing a tag like `v0.5.0` that matches that version does too.
#
#   Windows desktop : .msi and NSIS .exe          (windows-latest)
#   Linux desktop   : .deb, .rpm, .AppImage       (ubuntu-22.04, x86_64)
#   Linux node      : headless nebula-node .tar.gz (x86_64 and aarch64)
#   Android         : arm64 APK                   (android.yml)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.0). Must already exist."
        required: true

# Read-only by default; only the jobs that create or upload to the release
# get write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Nebula Host $TAG" \
              --notes "Nebula Host $TAG. See the assets below for Windows and Linux."

  desktop:
    name: Desktop (${{ matrix.name }})
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: msi,nsis
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.name }}

      - run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Nebula Host ${{ env.TAG }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

  node:
    name: Headless node (${{ matrix.arch }})
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: node-${{ matrix.arch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The node serves the web panel, compiled in from ../dist.
      - run: npm ci && npm run build

      - name: Build nebula-node (no desktop, no webview)
        run: cargo build --release --locked -p nebula-host --no-default-features --bin nebula-node

      - name: Package
        id: package
        run: |
          name="nebula-node-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "out/$name"
          cp target/release/nebula-node "out/$name/"
          cp packaging/linux/install-node.sh packaging/linux/nebula-node.service "out/$name/"
          chmod +x "out/$name/install-node.sh" "out/$name/nebula-node"
          tar -C out -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "file=out/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.file }}" "${{ steps.package.outputs.file }}.sha256" --clobber

  android:
    name: Android APK
    permissions:
      contents: write
    needs: create-release
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: Publish release
    permissions:
      contents: write
    needs: [desktop, node, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
