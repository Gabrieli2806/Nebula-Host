# Builds the Android APK (arm64, debug build). Run by hand to get the APK as
# a workflow artifact, or from the Release workflow, which attaches it to the
# release.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the .jks file,
# base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD, every APK is signed with that one key, so each release
# installs over the last. Without them the runner's throwaway debug key is
# used and Android refuses to update from the previous release.
#
# Run by hand with "store: play" for the Google Play flavor (cargo feature
# `play-store`: no mod loaders, mods or hosting on the phone).
name: Android

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Which build: full (GitHub releases) or play (Google Play flavor)."
        type: choice
        options: [full, play]
        default: full
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to."
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.0.12674087"
  GAME_NDK_VERSION: "27.3.13750724"

jobs:
  apk:
    name: APK (arm64)
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The game engine is a pinned submodule; its own native dependency
      # needs a mirror URL.
      - name: Game engine sources
        run: |
          git submodule update --init src-tauri/android/engine
          git -C src-tauri/android/engine -c submodule.androidnsbypass.url=https://github.com/alexytomi/androidnsbypass.git submodule update --init androidnsbypass

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDKs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "ndk;${GAME_NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-arm64

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: .cache
          key: android-runtimes-${{ hashFiles('scripts/android-jre.mjs', 'scripts/android-game-jre.mjs') }}

      - run: npm ci

      - name: Bundled Java runtimes
        run: |
          node scripts/android-game-jre.mjs
          node scripts/android-jre.mjs arm64-v8a 21,25

      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=Unstable signature::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with a throwaway debug key and will not install over the previous release."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nebula-release.jks"
          echo "NEBULA_KEYSTORE=$RUNNER_TEMP/nebula-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          NEBULA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEBULA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEBULA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_FEATURES: ${{ inputs.store == 'play' && '--features play-store' || '' }}
        run: npx tauri android build --debug --target aarch64 --apk --ci $STORE_FEATURES

      # Report only for now: the bundled runtimes are prebuilt, and Play stops
      # accepting updates without 16 KB support on 2027-02-01.
      - name: 16 KB page alignment
        run: scripts/check-16k.sh src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          suffix=""
          if [ "${{ inputs.store }}" = "play" ]; then suffix="-play"; fi
          name="NebulaHost-${version}-android-arm64${suffix}.apk"
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
          echo "file=out/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" --clobber
