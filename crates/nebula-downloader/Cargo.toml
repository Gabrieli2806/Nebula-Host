[package]
name = "nebula-downloader"
version = "0.1.0"
edition = "2021"
description = "Shared download utilities for Nebula Hosting (retry, integrity, Range resume)"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "fs"] }
sha1 = "0.11"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
