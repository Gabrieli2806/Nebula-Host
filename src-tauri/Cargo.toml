[package]
name = "nebula-host"
version = "0.5.0"
description = "Self-hosted game server manager"
authors = ["Gabrieli2806"]
edition.workspace = true
default-run = "nebula-host"
rust-version.workspace = true
license.workspace = true

[lib]
name = "nebula_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nebula-host"
path = "src/main.rs"
required-features = ["desktop"]

# Headless node (Raspberry Pi, servers): the same backend, no window.
[[bin]]
name = "nebula-node"
path = "src/bin/nebula-node.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-single-instance",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

nebula-downloader = { path = "../crates/nebula-downloader" }

async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { workspace = true }
dirs = "6"
flate2 = "1"
futures-util = { workspace = true }
hex = { workspace = true }
if-addrs = "0.13"
# Server icons: decode whatever the user picks, write a 64x64 PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
igd-next = { version = "0.16", features = ["aio_tokio"] }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
# Transfers: the archive a node sends is verified end to end.
sha2 = { workspace = true }
sys-locale = "0.3"
sysinfo = "0.33"
# Java runtimes ship as .tar.gz outside Windows.
tar = "0.4"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
zip = "2"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
