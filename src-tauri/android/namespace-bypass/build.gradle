apply plugin: 'com.android.library'
def upstream = file('../engine/androidnsbypass/src/main')
android {
    namespace 'dev.alexytomi.androidnsbypass'
    compileSdk 36
    ndkVersion '27.3.13750724'
    defaultConfig {
        minSdk 24
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    sourceSets { main { java.srcDirs = [new File(upstream, 'java')]; manifest.srcFile new File(upstream, 'AndroidManifest.xml') } }
    externalNativeBuild { cmake { path new File(upstream, 'cpp/CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { prefabPublishing true }
    prefab { androidnsbypass { headers new File(upstream, 'cpp/include').absolutePath } }
}
